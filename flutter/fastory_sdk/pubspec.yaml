name: fastory_sdk
description: Fastory games hub SDK — opens a fanzone games hub and its games in native web views, from any Flutter app.
version: 0.4.0
homepage: https://fastory.io
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.fastory.sdk.flutter
        pluginClass: FastorySdkPlugin
      ios:
        pluginClass: FastorySdkPlugin
