group = "com.fastory.sdk.flutter"
version = "0.5.0"

buildscript {
    ext.kotlin_version = "1.9.22"
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.2.2")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "com.fastory.sdk.flutter"
    compileSdk = 34

    defaultConfig {
        minSdk = 24
        // The keep rule ships with this module and reaches the host app only through this
        // declaration: without it consumer-rules.pro still ships and R8 never reads it.
        consumerProguardFiles "consumer-rules.pro"
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }
}

dependencies {
    implementation("androidx.core:core-ktx:1.13.1")
    implementation("androidx.appcompat:appcompat:1.7.0")
    implementation("com.google.android.material:material:1.12.0")
    // WebMessageListener is the only Android entry point that reports the posting frame and its
    // origin — the gate the bridge's reply channel needs, which addJavascriptInterface cannot give
    // (SPEC §13.8.4).
    implementation("androidx.webkit:webkit:1.11.0")
    // The reference OpenID client, carrying the system-browser leg of identify(FanId): the
    // authorization request, state and PKCE run in a Custom Tab, never a WebView (SPEC § 2.6).
    implementation("net.openid:appauth:0.11.1")
    implementation("androidx.lifecycle:lifecycle-process:2.6.1")
}
